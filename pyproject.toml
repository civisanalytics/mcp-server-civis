[project]
name = "mcp-server-civis"
version = "1.1.0"
description = "A Model Context Protocol server providing tools for accessing Civis platform"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["civis", "analytics", "mcp", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "civis>=2.7.0,<3",
]

[project.scripts]
mcp-server-civis= "mcp_server_civis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "flake8>=7.3.0",
    "freezegun>=1.5.1,<2",
    "pyright>=1.1.389,<2",
    "pytest>=8.3.3,<9",
    "ruff>=0.8.1,<1",
]
